<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunt the Karens</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 22 Q6 14 12 12 L14 10 Q16 6 20 8 Q26 10 26 16 L26 22 Q26 26 22 26 L10 26 Q6 26 6 22Z' fill='%234a4' stroke='%23222' stroke-width='1.5'/%3E%3Ccircle cx='18' cy='16' r='2.5' fill='%23222' opacity='0.4'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/game.css">
    <script>
        // Apply theme before any rendering to avoid flash
        (function() {
            const stored = localStorage.getItem('htk-theme');
            if (stored) {
                document.documentElement.setAttribute('data-theme', stored);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>
<body>
    <div id="blocker">
        <div id="instructions">
            <h1>HUNT THE KARENS</h1>
            <p class="tagline">A hyper-realistic suburban combat experience</p>
            <div class="controls">
                <p><strong>WASD</strong> Move</p>
                <p><strong>Mouse</strong> Look</p>
                <p><strong>Left Click</strong> Fire Weapon</p>
                <p><strong>1/2/3</strong> Switch Weapons</p>
                <p><strong>R</strong> Reset Scene</p>
                <p><strong>F3</strong> Toggle Debug</p>
            </div>
            <p class="start-prompt">Click anywhere to begin</p>
        </div>
    </div>

    <button id="theme-toggle" title="Toggle theme">&#x1F312; Theme</button>
    <div id="version-footer"></div>

    <div id="hud" class="hidden">
        <div id="crosshair"></div>
        <div id="hud-top">
            <div id="score-display">
                <span class="label">SCORE</span>
                <span id="score-value">0</span>
            </div>
            <div id="combo-display">
                <span id="combo-value"></span>
            </div>
            <div id="weapon-display">
                <span class="label">WEAPON</span>
                <span id="weapon-name">Croc</span>
                <span class="label">AMMO</span>
                <span id="ammo-value">∞</span>
            </div>
        </div>
        <div id="weapon-slots">
            <div class="weapon-slot" id="slot-1" data-slot="0">
                <span class="slot-key">1</span>
                <span class="slot-name">Croc</span>
            </div>
            <div class="weapon-slot" id="slot-2" data-slot="1">
                <span class="slot-key">2</span>
                <span class="slot-name">Water Balloon</span>
            </div>
            <div class="weapon-slot" id="slot-3" data-slot="2">
                <span class="slot-key">3</span>
                <span class="slot-name">Garden Gnome</span>
            </div>
        </div>
        <div id="status-effects"></div>
        <div id="hud-bottom">
            <div id="hit-feedback"></div>
        </div>
    </div>

    <div id="debug-overlay" class="hidden">
        <div id="debug-content">
            <h3>DEBUG</h3>
            <div id="debug-stats"></div>
        </div>
    </div>

    <div id="hit-marker" class="hidden"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "./vendor/three/three.module.js",
            "three/addons/": "./vendor/three/"
        }
    }
    </script>

    <script type="module" src="src/main.js"></script>
</body>
</html>
